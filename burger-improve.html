    <title>Burger Dashboard v2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-image">
        <div class="card">
            <div class="description-side">
                <div class="header">
                    <h1 id="fastFood">FastFood</h1>
                </div>

                <div class="captions">
                    <div class="straight-line"></div>

                        <div class="buttons">

                            <button>Book a table</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="image-side">

            </div>
        </div>
    </div>
