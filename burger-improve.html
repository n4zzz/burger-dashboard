<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Dashboard v2</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="bg-image">
        <div class="card">
            <div class="description-side">
                <div class="header">
                    <h1 id="fastFood">FastFood</h1>
                </div>

                <div class="captions">
                    <div class="straight-line"></div>
                    <div class="caption-text">
                        <h1 id="amazingBurger">AMAZING BURGER</h1>
                        <h2 id="lowPrice">AT LOW PRICE</h2>
                        <p id="takeaway">Get the best of your takeaway food with a low budget</p>

                        <div class="buttons">
                            <button>View Menu</button>
                            <button>Book a table</button>
                        </div>

                        <div class="footer">
                            <div class="breakfast">
                                <h3>Breakfast</h3>
                                <p>6am to 11am</p>
                            </div>
                            <div class="lunch">
                                <h3>Lunch</h3>
                                <p>12pm to 2pm</p>
                            </div>
                            <div class="dinner">
                                <h3>Dinner</h3>
                                <p>6pm to 10pm</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="image-side">
                <img src="burger-image.png">
            </div>
        </div>
    </div>

</body>
</html>
