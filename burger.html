<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <article>
            <div class="main-card">
                <div class="card-container">
                    <h1>FastFood</h1>
                    <div class="desc-container">
                        <div class="straight-line">
                            <div></div>
                        </div>

                        <div class="caption-box">
                            <p id="amazing-burger">AMAZRIN BURGER</p>
                            <p id="low-price">AT LOW PRICE</p>
                            <p id="description">Get the best of your takeaway food with low budget</p>

                            <div class="buttons">
                                <button type="submit">View menu</button>
                                <button type="submit">Book a table</button>
                            </div>

                            <div class="footer">
                                <div class="breakfast">
                                    <h2>Breakfast</h2>
                                    <p>8am to 11am</p>
                                </div>
                                <div class="Lunch">
                                    <h2>Lunch</h2>
                                    <p>12pm to 2pm</p>
                                </div>
                                <div class="Dinner">
                                    <h2>Dinner</h2>
                                    <p>6pm to 10pm</p>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
                <!-- <header>
                    <div class="card-header">
                        <h1>FastFood</h1>
                    </div>
                </header> -->

                <!-- <Section>
                    <div class="card-header">
                        <h1>FastFood</h1>
                    </div>
                </Section> -->
                <div class="image">
                    <img src="burger-image.png" alt="burger.png">
                </div>
            </div>
        </article>
    </main>
</body>

</html>
